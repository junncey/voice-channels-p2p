name: "\U0001F680 Feature request"
description: Suggest an idea for Voice Channels P2P
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement.

        **Note**: this is a personal fork maintained by one person. Feature requests are
        weighed against the project scope — a persistent, audio-first channel service.
        Video, screen sharing, whiteboard and file transfer were removed on purpose and
        will not be reintroduced.
  - type: textarea
    attributes:
      label: Feature request
      description: A clear and concise description of what you want.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why it fits the scope
      description: Who benefits, and why the existing behaviour is insufficient.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Mockups, prior art, or links to related issues.
