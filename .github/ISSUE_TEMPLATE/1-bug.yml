name: "\U0001F41B Bug report"
description: Something in Voice Channels P2P does not behave as documented
#labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for defects in the **Voice Channels P2P** source code.

        **Before posting, please check whether a similar issue already exists.**

        ⚠️ Security issues must not be filed here — use
        [private advisories](https://github.com/junncey/voice-channels-p2p/security/advisories/new) instead.
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what is wrong.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The exact sequence that triggers it. Mention the channel name pattern, whether it was a temporary room, and how many participants were connected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Output of `curl -s https://<your-host>/api/version`, or the image tag you deployed.
      placeholder: '1.5.0 / sha256:a2b76d98…'
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Deployment
      options:
        - Docker image (b1at-public/voice-channels)
        - Built from source (node app/src/server.js)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Network path
      description: Whether a TURN relay was involved decides most media bugs.
      options:
        - '--'
        - Direct P2P only (no TURN)
        - Relay used (TURN)
        - Mixed / unknown
    validations:
      required: true
  - type: markdown
    attributes:
      value: "**Select every device where it happens.**"
  - type: checkboxes
    attributes:
      label: Device
      options:
        - label: Android
        - label: iPhone
        - label: Linux
        - label: Mac
        - label: Windows
  - type: markdown
    attributes:
      value: "**Select every browser where it happens.**"
  - type: checkboxes
    attributes:
      label: Browser
      options:
        - label: Chrome (or Chromium based)
        - label: Firefox
        - label: Safari
        - label: Android browser
        - label: iOS browser
        - label: Other desktop browser
  - type: textarea
    attributes:
      label: Relevant log output
      description: Browser console output and/or server log lines. Remove channel names, IPs and tokens before pasting. Formatted as code automatically.
      render: shell
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that applies — reverse proxy, coturn version, PWA install state, whether the tab was backgrounded, etc.
  - type: markdown
    attributes:
      value: |
        **Attach images or screenshots**

        Drag and drop them here if they help illustrate the problem.
