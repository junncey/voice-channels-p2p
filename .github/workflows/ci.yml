name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      # 🔴 本地复合 action 必须在 checkout 之后才能被解析（runner 在
      # "Prepare all required actions" 阶段就要读到 action.yml）
      - name: Checkout
        uses: actions/checkout@v4

      # lint + 测试的完整门禁（与 Docker 发布门禁共用）
      - name: Lint & Test
        uses: ./.github/actions/lint-test

  # Rust 原生组件（一起听 → 应用音频桥）：仅 Windows 有意义，与 Node job 并行
  helper-rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper/app-audio-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper/app-audio-bridge

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test
