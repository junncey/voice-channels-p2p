name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x' # LTS — matches the Dockerfile runtime
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Lint (eslint + prettier --check)
        run: npm run lint

      - name: Run unit tests
        run: npm test

  # Rust 原生组件（一起听 → 应用音频桥）：仅 Windows 有意义，与 Node job 并行
  helper-rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper/app-audio-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper/app-audio-bridge

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test
