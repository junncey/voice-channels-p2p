name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x' # LTS — matches the Dockerfile runtime
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Lint (eslint + prettier --check)
        run: npm run lint

      - name: Run unit tests
        run: npm test
