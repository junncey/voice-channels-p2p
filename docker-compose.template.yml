services:
    voice-channels:
        image: voice-channels:latest
        container_name: voice-channels
        hostname: voice-channels
        # Run as non-root (uid:gid). The image already defaults to the non-root
        # "node" user (1000:1000); set this to override with a different uid/gid.
        user: '1000:1000'
        restart: unless-stopped
        ports:
            - '${PORT}:${PORT}'
        volumes:
            - ./.env:/src/.env:ro
            # Persistent channel registry (channels created in the /admin
            # console). Without this mount the registry is lost on rebuild:
            - ./app/src/channels.json:/src/app/src/channels.json
            # Persistent text chat history (retention configurable in /admin →
            # server settings). Without this mount the history is lost on rebuild:
            - ./app/src/chat_history:/src/app/src/chat_history
# Uncomment below, remove "ports:" section above and configure labels as
# needed for LetsEncrypt TLS certificates with Traefik.
# See https://doc.traefik.io/traefik/user-guides/docker-compose/basic-example/
#   expose:
#     - 3000
#   labels:
#     - "traefik.enable=true"
#     - "traefik.http.routers.voice-channels.rule=Host(`voice-channels.example.com`)"
#     - "traefik.http.routers.voice-channels.entrypoints=websecure"
#     - "traefik.http.routers.voice-channels.tls.certresolver=myresolver"
#     - "traefik.http.services.voice-channels.loadbalancer.server.port=3000"
