<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <title>应用声音桥 · 只分享一个应用的声音</title>
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font:
                    14px/1.6 system-ui,
                    'Microsoft YaHei',
                    sans-serif;
                background: #10151c;
                color: #e8edf2;
            }
            .wrap {
                max-width: 720px;
                margin: 0 auto;
                padding: 24px 16px 60px;
            }
            h1 {
                font-size: 18px;
                margin: 0 0 4px;
            }
            .sub {
                color: #9fb0c0;
                margin-bottom: 18px;
            }
            .guide {
                border: 1px solid #2a3a4a;
                background: #16202b;
                border-radius: 10px;
                padding: 10px 14px;
                margin-bottom: 18px;
            }
            .guide ol {
                margin: 6px 0 2px;
                padding-left: 20px;
            }
            .guide b {
                color: #7fd1a8;
            }
            .row {
                display: flex;
                gap: 8px;
                align-items: center;
                margin-bottom: 12px;
            }
            input[type='search'] {
                flex: 1;
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #2a3a4a;
                background: #0d141c;
                color: #e8edf2;
                font-size: 14px;
            }
            #status {
                padding: 8px 12px;
                border-radius: 8px;
                background: #0d141c;
                border: 1px solid #2a3a4a;
            }
            #status.running {
                border-color: #2f7d4f;
                color: #7fd1a8;
            }
            #status.stopped {
                border-color: #8a5a2a;
                color: #e0b070;
            }
            #meter {
                height: 6px;
                border-radius: 3px;
                background: #0d141c;
                overflow: hidden;
                border: 1px solid #2a3a4a;
                margin-bottom: 12px;
            }
            #meterBar {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #2f7d4f, #c9b458);
            }
            #plist {
                border: 1px solid #2a3a4a;
                border-radius: 10px;
                overflow: hidden;
            }
            .prow {
                display: flex;
                gap: 10px;
                padding: 7px 12px;
                cursor: pointer;
                border-bottom: 1px solid #1c2937;
            }
            .prow:hover {
                background: #1a2937;
            }
            .prow .pid {
                color: #9fb0c0;
                width: 64px;
                flex: none;
            }
            .prow .mem {
                color: #6c8095;
                width: 84px;
                flex: none;
                text-align: right;
            }
            .badge {
                margin-left: auto;
                font-size: 12px;
                padding: 1px 8px;
                border-radius: 10px;
                flex: none;
            }
            .badge.on {
                background: #1d4030;
                color: #7fd1a8;
            }
            .badge.off {
                background: #2a2f36;
                color: #8a97a3;
            }
            button {
                padding: 8px 14px;
                border-radius: 8px;
                border: 1px solid #2a3a4a;
                background: #16202b;
                color: #e8edf2;
                cursor: pointer;
            }
            button:hover {
                border-color: #3d5670;
            }
            .hint {
                color: #9fb0c0;
                font-size: 12.5px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>应用声音桥</h1>
            <div class="sub">
                选中一个应用，它的声音（含子进程）只在本页播放；回频道页「一起听」分享「本标签页」即可
            </div>
            <div class="guide">
                <b>推荐：频道页直连（无重音）</b>
                <ol>
                    <li>让目标应用（音乐客户端 / 游戏）出声</li>
                    <li>
                        频道页 → 点「一起听」→ 选<b>分享本机应用的声音</b> →
                        列表选它（需本工具在后台运行即可，无需分享本页）
                    </li>
                </ol>
                <b>本页仅用于试听确认</b>：选中应用后本页会播放它的声音——注意与源应用本地重音属正常现象。
            </div>
            <div id="status">未在采集</div>
            <div id="meter"><div id="meterBar"></div></div>
            <div class="row">
                <input id="q" type="search" placeholder="搜索应用名或 PID，如 cloudmusic / 1234" autofocus />
                <button id="allBtn" type="button">显示全部进程</button>
                <button id="stopBtn" type="button">停止</button>
            </div>
            <div id="plist"></div>
            <div class="hint">
                列表只显示能发声的应用（同 Windows
                音量混合器），正在播放的排最前、点它即可。同名多进程时点击会自动轮换重试。
            </div>
        </div>
        <script>
            'use strict';
            const $ = (id) => document.getElementById(id);
            let mode = 'apps'; // apps = 只列能发声的应用；all = 全部进程
            let data = { apps: [], all: [], fallback: '' };
            const rotation = {}; // 应用名 -> 已点击次数（同名多进程轮换重试）
            const fmt = (n) => (n >= 1024 ? (n / 1024).toFixed(1) + ' GB' : n + ' MB');

            async function refreshList() {
                try {
                    const res = await fetch('/api/processes' + (mode === 'all' ? '?all=1' : ''));
                    const next = await res.json();
                    if (next.apps) data.apps = next.apps;
                    if (next.all) data.all = next.all;
                    if (next.fallback !== undefined) data.fallback = next.fallback;
                    render();
                } catch {
                    /* 服务重启瞬间忽略 */
                }
            }
            function emptyRow(text) {
                const d = document.createElement('div');
                d.className = 'prow';
                d.style.cursor = 'default';
                d.textContent = text;
                return d;
            }
            function render() {
                const q = $('q').value.trim().toLowerCase();
                const box = $('plist');
                if (mode === 'apps') {
                    const list = data.apps.filter(
                        (a) => !q || a.name.toLowerCase().includes(q) || a.pids.some((p) => String(p.pid).includes(q))
                    );
                    if (!list.length) {
                        const why = data.fallback ? `（枚举失败：${data.fallback}）` : '';
                        box.replaceChildren(emptyRow(`没有检测到能发声的应用——先让目标应用播放声音${why}`));
                        return;
                    }
                    box.replaceChildren(
                        ...list.map((a) => {
                            const row = document.createElement('div');
                            row.className = 'prow';
                            const name = document.createElement('span');
                            name.className = 'name';
                            name.textContent = a.name;
                            const mem = document.createElement('span');
                            mem.className = 'mem';
                            mem.textContent = fmt(a.mem);
                            const badge = document.createElement('span');
                            badge.className = 'badge ' + (a.active ? 'on' : 'off');
                            badge.textContent =
                                (a.active ? '播放中' : '空闲') + (a.pids.length > 1 ? ' ×' + a.pids.length : '');
                            row.append(name, mem, badge);
                            row.title = a.pids.map((p) => `PID ${p.pid}${p.active ? '（播放中）' : ''}`).join('\n');
                            row.onclick = () => {
                                // 正在发声的进程已排在最前；同名多进程时点击轮换重试
                                const idx = (rotation[a.name] || 0) % a.pids.length;
                                rotation[a.name] = idx + 1;
                                start({ pid: a.pids[idx].pid, name: a.name });
                            };
                            return row;
                        })
                    );
                } else {
                    const list = data.all
                        .filter((p) => !q || p.name.toLowerCase().includes(q) || String(p.pid).includes(q))
                        .slice(0, 300);
                    box.replaceChildren(
                        ...(list.length
                            ? list.map((p) => {
                                  const row = document.createElement('div');
                                  row.className = 'prow';
                                  const pid = document.createElement('span');
                                  pid.className = 'pid';
                                  pid.textContent = p.pid;
                                  const name = document.createElement('span');
                                  name.className = 'name';
                                  name.textContent = p.name;
                                  const mem = document.createElement('span');
                                  mem.className = 'mem';
                                  mem.textContent = fmt(p.mem);
                                  row.append(pid, name, mem);
                                  row.onclick = () => start(p);
                                  return row;
                              })
                            : [emptyRow('没有匹配的进程')])
                    );
                }
            }
            async function start(p) {
                stopPlayback();
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pid: p.pid, name: p.name }),
                });
                const data = await res.json();
                if (!data.ok) {
                    setStatus('启动失败：' + (data.error || '未知错误'), 'stopped');
                    return;
                }
                setStatus(`采集中：${p.name}（PID ${p.pid}），正在播放它的声音`, 'running');
                beginPlayback();
            }
            async function stopAll() {
                stopPlayback();
                await fetch('/api/stop', { method: 'POST' });
                setStatus('已停止', '');
            }
            function setStatus(text, cls) {
                const el = $('status');
                el.textContent = text;
                el.className = cls || '';
            }
            $('stopBtn').onclick = stopAll;
            $('q').oninput = render;
            $('allBtn').onclick = () => {
                mode = mode === 'apps' ? 'all' : 'apps';
                $('allBtn').textContent = mode === 'apps' ? '显示全部进程' : '只显示能发声的';
                refreshList();
            };

            // ---- 播放：fetch /stream 二进制 float32 → WebAudio 队列 ----
            let playAbort = null;
            let ctx = null,
                analyser = null,
                meterRAF = 0;
            function stopPlayback() {
                if (playAbort) {
                    playAbort.abort();
                    playAbort = null;
                }
                if (meterRAF) {
                    cancelAnimationFrame(meterRAF);
                    meterRAF = 0;
                }
            }
            async function beginPlayback() {
                if (!ctx) {
                    ctx = new AudioContext({ sampleRate: 48000 });
                    analyser = ctx.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.connect(ctx.destination);
                }
                await ctx.resume(); // 由「点选进程」的手势激活
                runMeter();
                playAbort = new AbortController();
                try {
                    const res = await fetch('/stream', { signal: playAbort.signal });
                    const reader = res.body.getReader();
                    // 注意：下面这段「8 字节重对齐 + 丢帧追赶」播放循环与频道页
                    // public/js/pages/channel/share.js 的 pump 是双份手抄（本页
                    // 内嵌进 exe、无法共享模块），改动须两处同步
                    let nextTime = 0;
                    let pending = new Uint8Array(0); // read() 按网络任意切割，跨段累积对齐到整帧（8 字节）
                    for (;;) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const merged = new Uint8Array(pending.length + value.byteLength);
                        merged.set(pending);
                        merged.set(value, pending.length);
                        const usable = Math.floor(merged.byteLength / 8) * 8;
                        pending = merged.slice(usable);
                        const frames = usable / 8;
                        if (!frames) continue;
                        const work = merged.slice(0, usable); // 独立副本，byteOffset 归零保证 Float32 对齐
                        const interleaved = new Float32Array(work.buffer, 0, frames * 2);
                        const buf = ctx.createBuffer(2, frames, 48000);
                        const l = buf.getChannelData(0),
                            r = buf.getChannelData(1);
                        for (let i = 0; i < frames; i++) {
                            l[i] = interleaved[i * 2];
                            r[i] = interleaved[i * 2 + 1];
                        }
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        src.connect(analyser);
                        const now = ctx.currentTime;
                        if (nextTime < now + 0.03) nextTime = now + 0.03; // 30ms 起播余量
                        if (nextTime > now + 0.35) nextTime = now + 0.06; // 落后过多：丢帧追上
                        src.start(nextTime);
                        nextTime += buf.duration;
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') setStatus('播放中断：' + err.message, 'stopped');
                    return;
                }
                setStatus('采集已结束（进程退出或被停止）', 'stopped');
            }
            function runMeter() {
                if (!analyser) return;
                const data = new Uint8Array(analyser.fftSize);
                const tick = () => {
                    analyser.getByteTimeDomainData(data);
                    let peak = 0;
                    for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i] - 128));
                    $('meterBar').style.width = Math.min(100, (peak / 128) * 100 * 1.4) + '%';
                    meterRAF = requestAnimationFrame(tick);
                };
                tick();
            }

            // 状态轮询：进程退出时服务端会结束 /stream，这里兜底刷新显示
            setInterval(async () => {
                try {
                    const s = await (await fetch('/api/status')).json();
                    if (s.status !== 'running' && playAbort) {
                        stopPlayback();
                        setStatus('采集已结束（进程退出或被停止）', 'stopped');
                    }
                } catch {
                    /* 服务不在了 */
                }
            }, 1500);

            // 空闲时自动刷新「能发声的应用」列表（播放状态会变化）
            setInterval(() => {
                if (!playAbort && mode === 'apps') refreshList();
            }, 3000);

            refreshList();
        </script>
    </body>
</html>
