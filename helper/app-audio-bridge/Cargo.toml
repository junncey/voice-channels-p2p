[package]
name = "app-audio-bridge"
version = "1.0.0"
edition = "2021"
description = "只分享一个桌面应用的声音（Windows WASAPI 进程级音频回路，单文件 exe）"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "app-audio-bridge"
path = "src/main.rs"

[dependencies]
# HTTP 服务与异步运行时（特性按实际使用裁剪：无 #[tokio::main]、无 tokio::time、
# query 解析用 RawQuery——不受 axum feature 门控）
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
webbrowser = "1"

# 托盘图标与右键菜单（default-features 关掉仅 Linux 用的 appindicator 后端）
tray-icon = { version = "0.26", default-features = false }
# 解码内嵌托盘图标（RGBA8 PNG）
png = "0.17"

# WASAPI 进程级音频回路采集（激活/格式协商/事件驱动读取）
wasapi = "0.27"

# 进程枚举/存活/内存（系统级快照，免 unsafe 的 Toolhelp/OpenProcess 手写）与
# 系统版本探测（windows-rs 官方配套，内部即 RtlGetVersion）
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
windows-version = "0.100.0"

# 托盘消息泵（winit 事件循环，tray-icon 官方推荐搭配；退出走 EventLoopProxy
# 用户事件）与致命错误消息框（winsafe 的 HWND::MessageBox 安全封装）
winsafe = { version = "0.0.29", features = ["kernel", "user"] }
winit = "0.30.13"

[profile.release]
# 切勿加 panic = "abort"：wasapi.rs 的 catch_unwind 兜底（采集线程 panic 转
# 正常收尾）依赖 unwind，abort 会让任何线程 panic 直接带走整个进程
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
winresource = "0.1.34"
