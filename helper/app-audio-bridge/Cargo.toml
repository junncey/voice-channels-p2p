[package]
name = "app-audio-bridge"
version = "1.0.0"
edition = "2021"
description = "只分享一个桌面应用的声音（Windows WASAPI 进程级音频回路，单文件 exe）"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "app-audio-bridge"
path = "src/main.rs"

[dependencies]
# HTTP 服务与异步运行时（特性按实际使用裁剪：无 #[tokio::main]、无 tokio::time、
# query 解析用 RawQuery——不受 axum feature 门控）
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
webbrowser = "1"

# 托盘图标与右键菜单（default-features 关掉仅 Linux 用的 appindicator 后端）
tray-icon = { version = "0.26", default-features = false }
# 解码内嵌托盘图标（RGBA8 PNG）
png = "0.17"

# WASAPI 进程级音频回路采集（激活/格式协商/事件驱动读取）
wasapi = "0.27"

# Windows API 绑定（音频会话枚举 / 进程快照 / 系统版本 / 托盘消息循环）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }

[profile.release]
# 切勿加 panic = "abort"：wasapi.rs 的 catch_unwind 兜底（采集线程 panic 转
# 正常收尾）依赖 unwind，abort 会让任何线程 panic 直接带走整个进程
lto = "thin"
codegen-units = 1
strip = "symbols"
