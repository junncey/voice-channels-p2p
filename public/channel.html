<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>语音频道</title>
        <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
        <script src="/js/core/theme-boot.js"></script>
        <link rel="stylesheet" href="/css/tokens.css" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/channel.css" />
    </head>
    <body>
        <header class="channel-header">
            <div class="channel-id">
                <button id="backBtn" class="icon-btn" data-i18n-title="notFound.home" aria-label="home">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
                    </svg>
                </button>
                <div class="channel-titles">
                    <h1><span id="channelName">…</span><span id="tempBadge" class="badge temp hidden" data-i18n="channel.tempBadge">临时房间</span></h1>
                    <p id="channelDesc"></p>
                </div>
            </div>
            <div class="channel-actions">
                <span class="online-pill">
                    <span class="online-dot"></span>
                    <span id="onlineCount">0</span>
                </span>
                <button id="copyLinkBtn" class="btn ghost sm">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    <span data-i18n="channel.copyLink">复制邀请链接</span>
                </button>
                <span id="hostBadge" class="badge host hidden" data-i18n="channel.hostBadge">主持人</span>
                <button id="hostLoginEntryBtn" class="btn ghost sm hidden" data-i18n="channel.hostLoginBtn">主持人登录</button>
                <button id="lockBtn" class="btn ghost sm hidden">
                    <span id="lockBtnLabel"></span>
                </button>
            </div>
        </header>

        <main class="channel-layout">
            <!-- 左：语音成员 -->
            <aside class="panel voice-panel">
                <div class="panel-head">
                    <h2 data-i18n="channel.voicePanel">语音成员</h2>
                    <span id="memberCount" class="panel-head-count">0</span>
                </div>
                <ul id="memberList" class="member-list"></ul>
                <div class="voice-controls">
                    <div class="mic-level" aria-hidden="true"><div id="micLevelBar"></div></div>
                    <button id="micBtn" class="btn primary voice-btn">
                        <span id="micBtnIcon" class="mic-icon mic-on"></span>
                        <span id="micBtnLabel"></span>
                    </button>
                    <div class="voice-controls-row">
                        <button id="settingsBtn" class="btn ghost voice-icon-btn" data-i18n-title="settings.title" aria-label="audio settings">
                            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3" />
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
                            </svg>
                        </button>
                        <button id="leaveBtn" class="btn danger voice-btn" data-i18n="channel.leave">离开频道</button>
                    </div>
                </div>
            </aside>

            <!-- 右：文字聊天 -->
            <section class="panel chat-panel">
                <div class="panel-head">
                    <h2 data-i18n="channel.chatPanel">文字聊天</h2>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <div id="chatComposer" class="chat-composer">
                    <div id="chatAttachments" class="chat-attachments hidden"></div>
                    <form id="chatForm" class="chat-form" autocomplete="off">
                        <textarea id="chatInput" class="input chat-input" data-i18n-ph="channel.chatPlaceholder" maxlength="500" rows="1"></textarea>
                        <button type="button" id="imageBtn" class="icon-btn chat-image-btn" data-i18n-title="chat.sendImage" aria-label="send image">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="9" cy="9" r="2" />
                                <path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21" />
                            </svg>
                        </button>
                        <div class="send-btn-wrap">
                            <div id="sendKeyMenu" class="send-key-menu hidden">
                                <label class="send-key-option">
                                    <input type="radio" name="sendKey" value="enter" checked />
                                    <span class="option-check" aria-hidden="true"></span>
                                    <span data-i18n="channel.sendKeyEnter">按 Enter 键发送消息</span>
                                </label>
                                <label class="send-key-option">
                                    <input type="radio" name="sendKey" value="ctrlEnter" />
                                    <span class="option-check" aria-hidden="true"></span>
                                    <span data-i18n="channel.sendKeyCtrlEnter">按 Ctrl + Enter 键发送消息</span>
                                </label>
                            </div>
                            <div class="send-btn-group">
                                <button type="submit" class="btn primary send-btn" data-i18n="channel.send">发送</button>
                                <button type="button" id="sendKeyBtn" class="btn primary send-caret-btn" data-i18n-title="channel.sendKeyTitle" aria-haspopup="true">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="m17 14-5-5-5 5" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <!-- 预加入浮层 -->
        <div id="joinOverlay" class="overlay">
            <div class="modal join-card">
                <h2 id="joinTitle" data-i18n="channel.joinTitle">加入频道</h2>
                <p id="joinChannelName" class="join-channel-name">…</p>
                <div id="hostReadyHint" class="badge host hidden" data-i18n="channel.hostReady">将以主持人身份进入</div>
                <div class="field">
                    <input id="nickInput" class="input" data-i18n-ph="channel.nickPlaceholder" maxlength="24" />
                </div>
                <div id="joinPasswordField" class="field hidden">
                    <input id="channelPwInput" class="input" type="password" data-i18n-ph="channel.passwordPlaceholder" maxlength="64" autocomplete="off" />
                </div>
                <p id="joinError" class="join-error" role="alert"></p>
                <button id="joinBtn" class="btn primary join-btn" data-i18n="channel.joinBtn">进入频道</button>
                <div class="join-row">
                    <button id="textOnlyBtn" class="btn ghost join-alt" data-i18n="channel.textOnlyBtn">仅文字模式加入</button>
                    <button id="hostLoginBtn" class="btn ghost join-alt" data-i18n="channel.hostLoginBtn">主持人登录</button>
                </div>
            </div>
        </div>

        <!-- 主持人登录弹窗 -->
        <div id="hostModal" class="overlay hidden">
            <div class="modal">
                <h2 data-i18n="channel.hostLoginTitle">主持人登录</h2>
                <form id="hostLoginForm">
                    <div class="field">
                        <label for="hostUser" data-i18n="channel.hostUsername">主持人账号</label>
                        <input id="hostUser" class="input" maxlength="32" autocomplete="username" />
                    </div>
                    <div class="field">
                        <label for="hostPass" data-i18n="channel.hostPassword">密码</label>
                        <input id="hostPass" class="input" type="password" maxlength="64" autocomplete="current-password" />
                    </div>
                    <p id="hostLoginError" class="join-error" role="alert"></p>
                    <div class="modal-actions">
                        <button type="button" id="hostCancelBtn" class="btn ghost" data-i18n="admin.cancel">取消</button>
                        <button type="submit" class="btn primary" data-i18n="channel.hostLoginSubmit">登录并进入</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 主持人重命名成员弹窗 -->
        <div id="renameModal" class="overlay hidden">
            <div class="modal">
                <h2 data-i18n="channel.renameTitle">修改昵称</h2>
                <form id="renameForm">
                    <div class="field">
                        <label for="renameInput" data-i18n="channel.renameLabel">新昵称</label>
                        <input id="renameInput" class="input" maxlength="24" autocomplete="off" />
                    </div>
                    <p id="renameError" class="join-error" role="alert"></p>
                    <div class="modal-actions">
                        <button type="button" id="renameCancelBtn" class="btn ghost" data-i18n="admin.cancel">取消</button>
                        <button type="submit" class="btn primary" data-i18n="channel.renameSubmit">保存</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div id="settingsModal" class="overlay hidden">
            <div class="modal settings-modal">
                <h2 data-i18n="settings.title">设置</h2>
                <div class="settings-body">
                    <section class="settings-section">
                        <h3 data-i18n="settings.profile">个人资料</h3>
                        <div class="avatar-row">
                            <div id="avatarPreview" class="avatar-preview"></div>
                            <div class="avatar-actions">
                                <button type="button" id="avatarUploadBtn" class="btn ghost sm" data-i18n="settings.avatarChange">更换头像</button>
                                <button type="button" id="avatarResetBtn" class="btn ghost sm" data-i18n="settings.avatarReset">恢复默认</button>
                            </div>
                        </div>
                        <p class="settings-hint" data-i18n="settings.avatarHint">图片会自动裁剪为方形，仅保存在本浏览器，并同步展示给频道成员</p>
                        <input type="file" id="avatarFileInput" accept="image/*" class="hidden" />
                    </section>
                    <section class="settings-section">
                        <h3 data-i18n="settings.mic">麦克风</h3>
                        <div class="field">
                            <label data-i18n="settings.micDevice">输入设备</label>
                            <div id="micDeviceSelect" class="dropdown-root"></div>
                        </div>
                        <div class="level-meter" aria-hidden="true"><div id="settingsMicBar"></div></div>
                        <div class="volume-row">
                            <label for="micVolumeSlider" data-i18n="settings.micVolume">输入音量</label>
                            <input type="range" id="micVolumeSlider" min="0" max="200" step="5" />
                            <span id="micVolumeVal" class="volume-val">100%</span>
                        </div>
                        <label class="switch-row">
                            <span data-i18n="settings.noiseSuppression">噪声抑制</span>
                            <input type="checkbox" id="nsToggle" class="switch" />
                        </label>
                        <label class="switch-row">
                            <span data-i18n="settings.echoCancellation">回声消除</span>
                            <input type="checkbox" id="ecToggle" class="switch" />
                        </label>
                        <label class="switch-row">
                            <span data-i18n="settings.autoGainControl">自动增益</span>
                            <input type="checkbox" id="agcToggle" class="switch" />
                        </label>
                        <label class="switch-row">
                            <span data-i18n="settings.pushToTalk">按键通话</span>
                            <input type="checkbox" id="pttToggle" class="switch" />
                        </label>
                        <p class="settings-hint" data-i18n="settings.pushToTalkHint">开启后默认闭麦，按住 V 键说话</p>
                        <button type="button" id="testMicBtn" class="btn ghost sm" data-i18n="settings.testMic">测试麦克风</button>
                        <p class="settings-hint" data-i18n="settings.micTestHint">开启后实时听到自己的声音（约延迟半秒），再次点击停止</p>
                    </section>
                    <section class="settings-section">
                        <h3 data-i18n="settings.spk">扬声器</h3>
                        <div class="field">
                            <label data-i18n="settings.spkDevice">输出设备</label>
                            <div id="spkDeviceSelect" class="dropdown-root"></div>
                            <p id="sinkUnsupported" class="settings-hint hidden" data-i18n="settings.sinkUnsupported">当前浏览器不支持选择输出设备</p>
                        </div>
                        <div class="volume-row">
                            <label for="volumeSlider" data-i18n="settings.volume">音量</label>
                            <input type="range" id="volumeSlider" min="0" max="100" step="1" />
                            <span id="volumeVal" class="volume-val">100%</span>
                        </div>
                        <button type="button" id="testSpkBtn" class="btn ghost sm" data-i18n="settings.testSpk">测试扬声器</button>
                    </section>
                </div>
                <div class="modal-actions">
                    <button id="settingsCloseBtn" class="btn primary" data-i18n="settings.done">完成</button>
                </div>
            </div>
        </div>

        <input type="file" id="imageFileInput" accept="image/*" multiple hidden />

        <!-- 语音链路中断横幅：自愈进行中 / 自愈失败 -->
        <div id="outageBanner" class="outage-banner hidden" role="alert">
            <span class="outage-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" y1="2" x2="22" y2="22" />
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6" />
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 1.16-.29 2.26-.8 3.22" />
                    <line x1="12" y1="19" x2="12" y2="22" />
                </svg>
            </span>
            <span class="outage-text">
                <strong id="outageTitle"></strong>
                <span id="outageHint"></span>
            </span>
            <button id="outageActionBtn" class="btn primary sm"></button>
        </div>

        <div id="toasts" class="toasts"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="/js/pages/channel.js"></script>
    </body>
</html>
