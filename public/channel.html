<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>语音频道</title>
        <link rel="icon" href="/images/favicon.ico" />
        <link rel="stylesheet" href="/css/tokens.css" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/channel.css" />
    </head>
    <body>
        <header class="channel-header">
            <div class="channel-id">
                <button id="backBtn" class="icon-btn" data-i18n-title="notFound.home" aria-label="home">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
                    </svg>
                </button>
                <div class="channel-titles">
                    <h1 id="channelName">…</h1>
                    <p id="channelDesc"></p>
                </div>
            </div>
            <div class="channel-actions">
                <span class="online-pill">
                    <span class="online-dot"></span>
                    <span id="onlineCount">0</span>
                </span>
                <button id="copyLinkBtn" class="btn ghost sm">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    <span data-i18n="channel.copyLink">复制邀请链接</span>
                </button>
                <span id="hostBadge" class="badge host hidden" data-i18n="channel.hostBadge">主持人</span>
                <button id="lockBtn" class="btn ghost sm hidden">
                    <span id="lockBtnLabel"></span>
                </button>
            </div>
        </header>

        <main class="channel-layout">
            <!-- 左：语音成员 -->
            <aside class="panel voice-panel">
                <div class="panel-head">
                    <h2 data-i18n="channel.voicePanel">语音成员</h2>
                    <span id="memberCount" class="panel-head-count">0</span>
                </div>
                <ul id="memberList" class="member-list"></ul>
                <div class="voice-controls">
                    <div class="mic-level" aria-hidden="true"><div id="micLevelBar"></div></div>
                    <button id="micBtn" class="btn primary voice-btn">
                        <span id="micBtnIcon" class="mic-icon mic-on"></span>
                        <span id="micBtnLabel"></span>
                    </button>
                    <button id="leaveBtn" class="btn danger voice-btn" data-i18n="channel.leave">离开频道</button>
                </div>
            </aside>

            <!-- 右：文字聊天 -->
            <section class="panel chat-panel">
                <div class="panel-head">
                    <h2 data-i18n="channel.chatPanel">文字聊天</h2>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <form id="chatForm" class="chat-form" autocomplete="off">
                    <input id="chatInput" class="input" data-i18n-ph="channel.chatPlaceholder" maxlength="500" />
                    <button type="submit" class="btn primary" data-i18n="channel.send">发送</button>
                </form>
            </section>
        </main>

        <!-- 预加入浮层 -->
        <div id="joinOverlay" class="overlay">
            <div class="modal join-card">
                <h2 id="joinTitle" data-i18n="channel.joinTitle">加入频道</h2>
                <p id="joinChannelName" class="join-channel-name">…</p>
                <div id="hostReadyHint" class="badge host hidden" data-i18n="channel.hostReady">将以主持人身份进入</div>
                <div class="field">
                    <input id="nickInput" class="input" data-i18n-ph="channel.nickPlaceholder" maxlength="24" />
                </div>
                <p id="joinError" class="join-error" role="alert"></p>
                <button id="joinBtn" class="btn primary join-btn" data-i18n="channel.joinBtn">进入频道</button>
                <div class="join-row">
                    <button id="textOnlyBtn" class="btn ghost join-alt" data-i18n="channel.textOnlyBtn">仅文字模式加入</button>
                    <button id="hostLoginBtn" class="btn ghost join-alt" data-i18n="channel.hostLoginBtn">主持人登录</button>
                </div>
            </div>
        </div>

        <!-- 主持人登录弹窗 -->
        <div id="hostModal" class="overlay hidden">
            <div class="modal">
                <h2 data-i18n="channel.hostLoginTitle">主持人登录</h2>
                <form id="hostLoginForm">
                    <div class="field">
                        <label for="hostUser" data-i18n="channel.hostUsername">主持人账号</label>
                        <input id="hostUser" class="input" maxlength="32" autocomplete="username" />
                    </div>
                    <div class="field">
                        <label for="hostPass" data-i18n="channel.hostPassword">密码</label>
                        <input id="hostPass" class="input" type="password" maxlength="64" autocomplete="current-password" />
                    </div>
                    <p id="hostLoginError" class="join-error" role="alert"></p>
                    <div class="modal-actions">
                        <button type="button" id="hostCancelBtn" class="btn ghost" data-i18n="admin.cancel">取消</button>
                        <button type="submit" class="btn primary" data-i18n="channel.hostLoginSubmit">登录并进入</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="toasts" class="toasts"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="/js/pages/channel.js"></script>
    </body>
</html>
