<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>语音频道</title>
        <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
        <script src="/js/core/theme-boot.js"></script>
        <link rel="stylesheet" href="/css/tokens.css" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/index.css" />
    </head>
    <body>
        <div class="page">
            <header class="topbar">
                <a class="brand" href="/">
                    <span class="brand-mark">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                    </span>
                    <span data-i18n="app.brand">语音频道</span>
                </a>
                <nav class="topbar-nav">
                    <button id="themeBtn" class="theme-toggle" type="button">
                        <span class="theme-icon" aria-hidden="true"></span>
                        <span class="theme-label"></span>
                    </button>
                    <button id="clearDataBtn" class="topbar-link topbar-clear" data-i18n="index.clearData">清除用户信息</button>
                </nav>
            </header>

            <main class="hero">
                <h1 data-i18n="app.tagline">点开链接，加入语音与文字聊天</h1>
                <p data-i18n="app.heroSub">无需安装 · 无需注册 · 端到端直连</p>
                <button id="createTempBtn" class="btn primary hero-action" data-i18n="index.createTemp">创建临时房间</button>
            </main>

            <section class="channels-section">
                <div class="channels-head">
                    <h2 data-i18n="index.title">频道</h2>
                    <span id="statusHint" class="channels-status"></span>
                </div>
                <div id="channelGrid" class="channel-grid"></div>
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                    </div>
                    <p data-i18n="index.empty">暂无公开频道</p>
                    <p class="empty-hint" data-i18n="index.emptyHint"></p>
                </div>
            </section>
        </div>

        <!-- 清除本机用户信息 -->
        <div id="clearModal" class="overlay hidden">
            <div class="modal clear-modal">
                <h2 data-i18n="index.clearTitle">清除本机保存的信息</h2>
                <p class="clear-desc" data-i18n="index.clearDesc">以下信息仅保存在本浏览器，不影响其他设备。</p>
                <div class="clear-actions">
                    <button id="clearNickBtn" class="btn ghost">
                        <span data-i18n="index.clearNickOnly">仅清除用户名</span>
                        <span class="hint" data-i18n="index.clearNickOnlyHint">下次进入频道时重新输入昵称</span>
                    </button>
                    <button id="clearAllBtn" class="btn danger">
                        <span data-i18n="index.clearAll">清除用户名与全部配置</span>
                        <span class="hint" data-i18n="index.clearAllHint">包含音频设备选择、开关与对其他成员的音量调节</span>
                    </button>
                    <button id="clearCancelBtn" class="btn" data-i18n="admin.cancel">取消</button>
                </div>
            </div>
        </div>

        <div id="toasts" class="toasts"></div>

        <script type="module" src="/js/pages/index.js"></script>
    </body>
</html>
